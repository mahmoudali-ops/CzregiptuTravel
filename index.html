<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  <style>
    /* الصفحة كاملة سوداء */
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-direction: column;
    }

    /* النص الكبير */
    h1 {
      font-size: 6rem;
      margin: 0;
    }

    /* نص فرعي */
    p {
      font-size: 1.5rem;
      margin-top: 20px;
      color: #ccc;
    }

    /* تأثير بسيط على النص */
    h1 {
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <h1>404 not found</h1>
  <p>Oops! The page you are looking for does not exist.</p>
</body>
</html>
